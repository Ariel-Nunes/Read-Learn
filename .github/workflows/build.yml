name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node app.test.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capturas-de-falha
          path: falha-*.png
          if-no-files-found: ignore
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries><application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: mkdir -p ~/.android && echo "" | base64 -d > ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: read-learn-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
