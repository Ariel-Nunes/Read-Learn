const TEXTS=[{"id": "t01", "lv": "Iniciante", "title": "The New Neighbor", "body": "Emma lives in a small house near the park. She likes her neighborhood because it is quiet and beautiful. Every morning, she walks to the bakery and buys fresh bread. One Monday, Emma sees a moving truck outside the house next door. A young man is carrying boxes into the house. He looks tired, so Emma decides to help him. “Hello! Do you need some help?” she asks. “That would be great. Thank you!” he replies. His name is Daniel, and he has just moved to the city for a new job. He does not know anyone in the neighborhood. Emma helps him carry three boxes into the living room. After that, Daniel invites her to have a cup of coffee. They talk about their jobs, favorite movies, and hobbies. Emma discovers that Daniel loves cooking, while she enjoys trying new food. “Maybe you can teach me to cook,” Emma says. “Of course! And you can show me the best places in town.” They exchange phone numbers before Emma goes home. The following Saturday, Daniel prepares dinner for Emma. He makes pasta with tomato sauce and a delicious chocolate cake. They laugh, share stories, and listen to music. Emma realizes that helping a stranger can be the beginning of a wonderful friendship.", "pb": [30, 60, 68, 76, 100, 121, 142, 151, 163, 171, 190, 198], "m": ["house", "friend", "cup"]}, {"id": "t02", "lv": "Iniciante", "title": "The Missing Wallet", "body": "Tom is walking home from work when he sees a brown wallet on the sidewalk. He picks it up and opens it carefully. Inside, there is some money, a bank card, and a small photograph of an old woman. There is also an identity card with a name and an address. Tom looks at the photograph. The woman is smiling, and she seems very kind. He checks the address on his phone. The house is only ten minutes away, so he decides to take the wallet there. When he arrives, an elderly woman opens the door. “Excuse me. Did you lose a wallet?” Tom asks. The woman looks surprised. She quickly checks her bag and begins to smile. “Yes! I lost it at the supermarket this afternoon. I was so worried!” She thanks Tom several times and offers him some tea. At first, he says he must go home, but she insists. They sit in her kitchen and talk for a few minutes. Her name is Margaret, and she lives alone. Her children live in another city. Before Tom leaves, Margaret gives him a small bag of homemade cookies. “You have a good heart,” she says. Tom walks home feeling happy. He did not receive a reward, but he knows he did the right thing. The next morning, someone knocks on his door. It is Margaret, holding a fresh apple pie. “I forgot to thank you properly!” she says. Tom laughs and invites her inside.", "pb": [23, 51, 65, 87, 96, 105, 118, 131, 152, 177, 189, 196, 215, 231, 239], "m": ["wallet", "heart", "house"]}, {"id": "t03", "lv": "Iniciante", "title": "A Day at the Beach", "body": "Lucas and his sister Sofia are excited because their family is going to the beach. They wake up early, pack their bags, and get into the car with their parents. The journey takes two hours. Lucas listens to music while Sofia looks out the window. She loves watching the green hills and small towns along the road. When they arrive, the beach is full of people. Children are building sandcastles, couples are walking near the water, and a man is selling fresh coconut water. Lucas runs toward the sea, but his father stops him. “Put on your sunscreen first!” he says. After lunch, the family plays volleyball. Sofia is not very good at the game, but she makes everyone laugh when she falls onto the sand. Later, Lucas finds a small blue crab near a rock. He watches it move sideways before it disappears into a hole. At sunset, the family sits together and eats ice cream. The sky turns orange, pink, and purple. Sofia takes several photographs because she wants to remember the beautiful colors. On the way home, everyone is tired. Lucas falls asleep in the back seat, and Sofia rests her head against the window. Their father asks, “What was your favorite part of the day?” “The whole day,” Sofia answers sleepily. Lucas opens one eye and smiles. For their family, the best part of the beach is not the sea or the sand. It is spending time together.", "pb": [30, 57, 84, 94, 101, 126, 147, 164, 176, 198, 209, 215, 221], "m": ["sun", "wave", "cup"]}, {"id": "t04", "lv": "Iniciante", "title": "The Little Coffee Shop", "body": "Every morning, Ben visits a small coffee shop near his office. He always orders a large coffee and a cheese sandwich. He sits by the window and reads the news before work. One day, he notices a new employee behind the counter. She has curly hair and a friendly smile. “Good morning! The usual?” she asks. Ben is surprised. “You already know my order?” She laughs. “You come here every day!” Her name is Lily. Over the next few weeks, Ben and Lily begin talking more often. They discuss books, movies, and their plans for the weekend. Ben discovers that Lily wants to become a photographer. She shows him pictures of mountains, streets, and people she has met during her travels. One morning, Ben brings his old camera to the shop. “My grandfather gave me this camera years ago,” he says. “I never learned how to use it properly. Could you help me?” Lily is delighted. She teaches him how to take better pictures and explains how light changes a photograph. Soon, Ben starts taking pictures during his lunch breaks. He photographs buildings, trees, and people in the city. A month later, Lily organizes a small photography exhibition at the coffee shop. Ben is nervous when he sees his pictures on the wall. Several customers stop to admire them. “You have a good eye,” Lily tells him. Ben smiles. He still orders the same coffee every morning, but now he has a new hobby and a new friend.", "pb": [32, 50, 56, 64, 71, 97, 121, 131, 153, 171, 189, 213, 219, 227], "m": ["cup", "heart", "house"]}, {"id": "t05", "lv": "Iniciante", "title": "The Dog in the Rain", "body": "It is raining heavily when Maria leaves the supermarket. She carries two shopping bags and walks quickly toward her apartment. Suddenly, she hears a small sound near a bus stop. She looks around and sees a wet brown dog hiding under a bench. The dog is shaking. It has no collar, and it looks hungry. Maria puts her bags down and kneels beside it. “Hello, little friend. Are you lost?” she asks. The dog looks at her but does not move. Maria takes a small piece of bread from her bag. The dog eats it immediately. She then calls her brother, who loves animals. “Can you help me?” she asks. “I found a dog in the rain.” Her brother arrives twenty minutes later with a towel and a small box. Together, they take the dog to a nearby animal clinic. The veterinarian checks the dog and discovers a telephone number on a tiny tag hidden under its wet fur. Maria calls the number. A worried man answers. “My dog, Max! Have you found him?” he asks excitedly. Half an hour later, the man arrives at the clinic. Max runs toward him and jumps into his arms. The man explains that Max escaped from the garden during the storm. He thanks Maria and her brother again and again. Before going home, Maria looks at Max one last time. His tail is moving happily, and his owner is smiling. Maria walks into the rain with empty shopping bags and a warm feeling in her heart.", "pb": [20, 43, 55, 64, 72, 81, 104, 117, 140, 159, 167, 177, 196, 208, 217, 237], "m": ["dog", "cloudrain", "heart"]}, {"id": "t06", "lv": "Iniciante", "title": "The First Day at Work", "body": "Today is Ana's first day at a new job. She wakes up at six o'clock because she does not want to be late. She takes a shower, puts on her best clothes, and eats breakfast. Before leaving, she checks her bag three times to make sure she has everything. The office is in a tall building downtown. Ana arrives fifteen minutes early and waits near the reception desk. A friendly woman named Carla comes to meet her. “Welcome, Ana! Don't worry. Everyone feels nervous on the first day,” Carla says. She shows Ana around the office and introduces her to the other employees. Some people work with computers, while others talk to customers on the phone. Ana's manager explains her responsibilities. She will answer emails, organize documents, and help customers with simple questions. At first, Ana feels confused because there is so much information to remember. She writes everything in a notebook. During lunch, Carla invites her to eat with the team. They talk about their favorite restaurants and weekend activities. In the afternoon, Ana makes a small mistake in an email. She feels embarrassed and tells her manager immediately. “That is all right,” he says. “You are learning. Next time, you will remember.” When Ana arrives home, she is exhausted but proud of herself. Her mother asks, “How was your first day?” “It was difficult, but everyone was kind,” Ana replies. Before going to bed, Ana prepares her clothes for the next morning. She is still nervous, but she is also excited to learn more.", "pb": [23, 49, 68, 77, 90, 116, 133, 152, 171, 190, 204, 215, 223, 232, 244], "m": ["briefcase", "clock", "friend"]}, {"id": "t07", "lv": "Iniciante", "title": "A Surprise Birthday", "body": "It is David's thirtieth birthday, but he thinks everyone has forgotten it. His friends have been very quiet all week, and nobody has mentioned a party. He goes to work as usual and spends the day answering emails and attending meetings. When he arrives home, the apartment is dark. He opens the door slowly and turns on the light. “Surprise!” His best friends jump out from behind the sofa. His sister is holding a chocolate cake, and his father is taking pictures. David cannot believe his eyes. The living room is full of balloons, colorful lights, and small presents. “You told me you were busy tonight!” he says to his best friend, Mark. Mark laughs. “We wanted you to think we had forgotten.” Everyone sits around the table and shares pizza. They tell funny stories about their school days and laugh at old photographs. After dinner, David opens his presents. He receives a new pair of running shoes, a book about photography, and a handmade card from his little niece. The card has a drawing of David with very big ears. Everyone laughs when they see it. Later, the group plays music and dances in the living room. David looks around at the people he loves. He realizes that the presents are not the most important part of the evening. Before everyone leaves, he thanks them for organizing the party. “Next year, we will do something even bigger,” Mark says. David smiles. “Next year, I might organize the surprise myself!”", "pb": [26, 41, 59, 60, 82, 99, 113, 123, 144, 170, 187, 198, 220, 230, 240, 242], "m": ["cake", "star", "heart"]}, {"id": "t08", "lv": "Iniciante", "title": "The Secret Garden", "body": "When Mia visits her grandmother, she likes exploring the old house and its large garden. One afternoon, she notices a small wooden door behind some bushes. She has visited the house many times, but she has never seen the door before. It is locked, and the key is nowhere to be found. Mia asks her grandmother about it. “Oh, that old garden!” her grandmother says. “I have not visited it for years.” “Why not?” Mia asks. Her grandmother smiles sadly. “It reminds me of your grandfather. We planted flowers there when we were young.” Mia decides to find the key. She searches drawers, cupboards, and old boxes in the house. Finally, she finds a small silver key inside a book. The next morning, she opens the door. Behind it is a beautiful garden covered in wild plants. Roses grow beside an old stone path, and butterflies fly between the flowers. Mia spends the afternoon cleaning the garden. Her grandmother comes outside and helps her remove the weeds. As they work, her grandmother tells stories about her childhood and the wonderful days she spent there with her husband. Over the next few weeks, they plant new flowers and repair an old wooden bench. When the garden is ready, Mia's grandmother sits on the bench and closes her eyes. “It feels like he is here with us,” she whispers. Mia takes her grandmother's hand. The garden is no longer a forgotten place. It becomes their special place, full of memories, stories, and new beginnings.", "pb": [15, 41, 52, 58, 72, 76, 94, 110, 120, 150, 167, 187, 202, 217, 227, 232], "m": ["flower", "tree", "key"]}, {"id": "t09", "lv": "Iniciante", "title": "The Wrong Bus", "body": "Peter is going to an important job interview. He checks the time, grabs his bag, and runs to the bus stop. When the bus arrives, he gets on quickly. He sits near the back and starts reviewing the answers he has prepared. After fifteen minutes, Peter looks out the window. The streets seem unfamiliar. He checks the bus number and suddenly realizes that he is on the wrong bus! Peter gets off at the next stop. Unfortunately, he does not know where he is, and his phone battery is almost dead. He asks a woman walking nearby for directions. “You need to take the bus on the other side of the street,” she explains. “But it will take about thirty minutes.” Peter looks at his watch. His interview starts in twenty minutes. He begins to panic, but the woman offers to call a taxi using her phone. “Thank you so much!” Peter says. The taxi arrives quickly, and the driver takes him to the office. Peter reaches the building five minutes before the interview. He takes a deep breath, fixes his shirt, and walks inside. The interview goes better than he expects. His answers are clear, and the manager seems impressed. At the end, the manager asks, “Did you have any trouble finding us?” Peter laughs nervously. “Actually, I took the wrong bus!” The manager smiles. “Well, you made it anyway.” Three days later, Peter receives a phone call. He has got the job. From that day on, he always checks his bus number twice.", "pb": [21, 42, 54, 69, 91, 99, 121, 132, 147, 153, 174, 185, 201, 214, 217, 223, 231, 244], "m": ["bus", "clock", "compass"]}, {"id": "t10", "lv": "Iniciante", "title": "The Star in the Window", "body": "Every night, eight-year-old Leo looks through his bedroom window at the stars. He dreams of becoming an astronaut and traveling to the Moon. His father often tells him stories about space. They read books about planets and watch videos of rockets launching into the sky. One evening, Leo notices a bright light moving between the stars. It is not like the other lights he has seen before. “Dad! Come quickly!” he calls. His father looks through the window and smiles. “That might be a satellite,” he explains. Leo is disappointed. He hoped it was a spaceship from another planet. The next day, Leo tells his teacher about the light. She suggests that he join the school's science club. At first, Leo feels shy because the other children seem to know much more about space than he does. But the club leader welcomes him and gives him a small telescope. Every Wednesday, Leo learns about stars, planets, and the night sky. He begins keeping a notebook of everything he discovers. Months later, the science club organizes a public event. Leo stands in front of a group of families and explains how satellites move around Earth. His voice shakes at first, but he becomes more confident as he speaks. After the presentation, his father gives him a big hug. “You have learned so much,” he says. Leo looks up at the night sky. He still dreams of becoming an astronaut, but now he understands something important: big adventures often begin with small questions.", "pb": [23, 45, 67, 72, 80, 87, 99, 118, 149, 169, 194, 207, 217, 224, 231], "m": ["star", "frame", "house"]}, {"id": "t11", "lv": "Pré-intermediário", "title": "The Job Nobody Wanted", "body": "When Oliver lost his job at a large company, he spent three months looking for another one. He sent dozens of applications, but nobody invited him for an interview. One morning, his neighbor mentioned that a small bakery needed someone to help with deliveries. Oliver had never worked in a bakery before, and the salary was much lower than his previous one. However, he needed money, so he decided to give it a try. The owner, Mr. Harris, welcomed him warmly and explained his duties. Oliver would deliver bread to local shops and cafés every morning. The work was tiring. He had to wake up at four thirty, carry heavy boxes, and drive through the city before sunrise. Still, he enjoyed meeting different people. One customer, an elderly woman named Rose, always waited for him at her front door. She lived alone and loved talking about her garden. After a few weeks, Oliver noticed that several deliveries were arriving late because the bakery's delivery system was disorganized. He suggested a simple solution: grouping orders by neighborhood. The owner tried his idea, and delivery times improved immediately. Impressed by Oliver's initiative, Mr. Harris offered him a new position managing the bakery's daily operations. Oliver accepted with a smile. He had taken the job because he needed money, but he discovered something unexpected: sometimes, a step backward can lead you in a better direction.", "pb": [29, 44, 74, 96, 124, 148, 176, 186, 202, 207], "m": ["briefcase", "wrench", "star"]}, {"id": "t12", "lv": "Pré-intermediário", "title": "A Weekend Without Phones", "body": "When Maya suggested spending an entire weekend without smartphones, her friends thought she was joking. They spent hours every day scrolling through social media, watching videos, and checking messages. The idea of putting their phones away seemed almost impossible. Nevertheless, they agreed to try the experiment at a small countryside house. On Friday evening, everyone placed their phones inside a locked box. At first, the silence felt uncomfortable. Nobody knew what to do with their hands, and they kept looking at their pockets. The following morning, they went for a walk through the forest. Without music playing in their ears, they noticed birds singing, leaves moving in the wind, and water running over stones. Later, they cooked lunch together and played board games. They laughed more than they had in months. That evening, Maya told the group something she had never mentioned before: she often felt lonely even when she was talking to people online. Her friends admitted that they sometimes felt the same way. By Sunday afternoon, nobody was asking for their phones anymore. When they finally unlocked the box, dozens of notifications appeared on their screens. Surprisingly, none of them seemed particularly important. The experiment did not make them abandon technology. Instead, it helped them understand when technology was useful and when it distracted them from real life. Before leaving, they agreed to repeat the experience once a month. This time, nobody needed convincing.", "pb": [15, 39, 51, 83, 114, 131, 155, 165, 175, 195, 220, 231], "m": ["phone", "mountain", "tree"]}, {"id": "t13", "lv": "Pré-intermediário", "title": "The Last Train Home", "body": "Sophie had promised her mother that she would be home before midnight. Unfortunately, an important meeting at work lasted longer than expected, and she arrived at the station just as the last train was leaving. She checked the timetable. The next train would not arrive until morning. Frustrated, Sophie sat on a bench and considered her options. A taxi would cost too much, and her phone battery was almost empty. An older man sitting nearby noticed her worried expression. “Having a difficult evening?” he asked. Sophie explained what had happened. The man introduced himself as Arthur and said he was waiting for a friend who worked at the station. While they talked, Sophie discovered that Arthur had been a train driver for nearly forty years. He shared stories about passengers he had met and unusual situations he had experienced. One story particularly interested her. Years earlier, he had helped a young woman who was traveling alone and had lost all her money. He had contacted the station manager, who found a safe way for her to continue her journey. Eventually, Arthur's friend arrived. After hearing Sophie's situation, he helped her arrange a ride home with a trusted station employee who was finishing work. Sophie reached home safely just after one o'clock. The next morning, she sent Arthur a message thanking him for his kindness. He replied with a simple sentence: “Never underestimate the difference a conversation can make.” Sophie remembered those words for years.", "pb": [35, 47, 70, 79, 85, 109, 139, 179, 203, 211, 224, 238], "m": ["train", "house", "clock"]}, {"id": "t14", "lv": "Pré-intermediário", "title": "The Restaurant That Failed", "body": "When Daniel opened his own restaurant, he imagined customers waiting outside and positive reviews appearing online. He had spent years saving money and learning how to cook, and he believed he was ready. The first month was disappointing. Few people came in, and the restaurant lost money almost every day. Daniel blamed the location, the economy, and even the weather. He changed the menu twice, hoping to attract more customers, but nothing worked. One evening, a regular customer named Helen offered him some honest advice. “Your food is excellent,” she said, “but your restaurant feels expensive and unfriendly.” Daniel was offended at first. However, he decided to think carefully about her words. The next morning, he visited several successful local restaurants. He noticed that they offered affordable lunch options, welcomed customers warmly, and made ordering simple. He introduced a smaller menu, created a daily lunch special, and began greeting customers personally. Slowly, things improved. Office workers started visiting during their lunch breaks, and customers recommended the restaurant to their friends. Six months later, the restaurant was finally making a profit. Daniel realized that he had spent too much time defending his original idea and not enough time listening to the people he wanted to serve. He still had big ambitions, but he now understood that success was not about proving himself right. It was about discovering what worked.", "pb": [33, 50, 73, 85, 98, 112, 136, 151, 170, 180, 205, 222], "m": ["fork", "cup", "clock"]}, {"id": "t15", "lv": "Pré-intermediário", "title": "The Photograph in the Attic", "body": "After her grandfather passed away, Olivia helped her family clean his old house. Most of the rooms contained ordinary furniture, books, and boxes of things nobody had used for years. While exploring the attic, she discovered a wooden chest hidden behind a broken chair. Inside, she found several photographs, a collection of letters, and a map of a small coastal town. One photograph showed her grandfather as a young man standing beside a woman Olivia had never seen before. On the back, someone had written, “Summer, 1968. The happiest days of our lives.” Olivia knew her grandmother had died many years earlier, but the woman in the photograph was not her grandmother. Curious, she asked her father about it. He looked at the picture for a long time before explaining that his father had once been engaged to someone named Eleanor. They had planned to marry, but she had moved abroad, and they had lost contact. Olivia decided to follow the clues in the letters. She discovered that Eleanor had eventually returned to the same coastal town shown on the map. With her father's permission, Olivia contacted the local historical society, which helped her locate Eleanor's granddaughter. They exchanged messages and photographs, sharing memories that had been preserved for decades. Olivia never learned every detail of the old romance, but she discovered something meaningful: her grandfather's life had been full of experiences that existed long before she was born. The photographs no longer felt like mysterious objects. They were pieces of a human story.", "pb": [30, 44, 61, 93, 112, 156, 181, 197, 210, 239, 247], "m": ["frame", "house", "heart"]}, {"id": "t16", "lv": "Pré-intermediário", "title": "The Boy Who Could Fix Anything", "body": "Whenever something broke in his neighborhood, people called fourteen-year-old Noah. He could repair bicycles, replace broken computer parts, and make old radios work again. His talent had started with a damaged toy car he received when he was six. Instead of throwing it away, he opened it to discover how it worked. At school, however, Noah struggled with traditional lessons. He found long lectures boring and often received average grades, even though he understood technical problems quickly. One day, his science teacher announced a competition. Students had to design a device that could help people in their community. Noah immediately began planning a low-cost water-level alarm for families living near a river that sometimes flooded. He collected old electronic components and watched educational videos to learn what he needed. His first design failed because water damaged the circuit. Rather than giving up, he studied the problem and built a better protective case. On competition day, his alarm worked perfectly. The judges were impressed by its simplicity and affordability. Noah won first prize and received a scholarship for a technology program. His teacher congratulated him afterward. “You have always been curious,” she said. “Now you have learned how to turn curiosity into something useful.” Noah continued repairing things for his neighbors, but he also began helping younger students build their own projects. He had discovered that intelligence was not only about remembering information. Sometimes, it was about noticing a problem, experimenting with possible solutions, and refusing to stop after the first failure.", "pb": [24, 52, 77, 98, 115, 138, 152, 168, 180, 185, 203, 221, 232], "m": ["wrench", "friend", "house"]}, {"id": "t17", "lv": "Pré-intermediário", "title": "An Unexpected Guest", "body": "On a cold December evening, Rachel heard someone knocking on her apartment door. She was not expecting visitors, and it was already past ten. When she opened the door, she found a young woman holding a suitcase. “I'm sorry to bother you,” the stranger said. “I think I've got the wrong apartment.” Her name was Nina, and she had recently moved into the building. She was trying to visit a friend but had confused two similar addresses. Rachel helped her check the address on her phone. Unfortunately, Nina's phone had almost no battery, and the weather outside was getting worse. “Would you like to charge your phone for a few minutes?” Rachel offered. Nina accepted gratefully. While the phone charged, they talked over tea. Rachel discovered that Nina had moved to the city to study architecture. She had left her family behind and was finding it difficult to adjust. Rachel remembered feeling the same way when she had moved away from home years earlier. “You don't need to know everything on your first day,” she told Nina. “Give yourself time.” Nina eventually contacted her friend and found the correct apartment. Before leaving, she thanked Rachel for helping her. A week later, Nina knocked on Rachel's door again. This time, she brought a small cake as a thank-you gift. Their brief meeting became the beginning of a friendship. They started sharing meals, exploring the city, and helping each other through difficult days. Neither woman had planned to meet that evening. Sometimes, a small mistake creates an unexpected opportunity.", "pb": [24, 37, 52, 77, 100, 113, 116, 149, 164, 180, 190, 198, 218, 241, 249], "m": ["door", "friend", "cup"]}, {"id": "t18", "lv": "Pré-intermediário", "title": "The Village That Disappeared", "body": "When Ethan arrived in the mountains, he was looking for a quiet place to spend his vacation. He had found a photograph of a beautiful village online and decided to visit it. After a long drive, he reached the location shown on his map. However, there was no village. Instead, he found a few stone walls, an abandoned road, and trees growing between old buildings. Confused, Ethan stopped at a nearby farm and asked an elderly farmer about the place. “That was my village,” the farmer explained. “Most people left after the river flooded the valley many years ago.” The farmer invited Ethan inside and showed him old photographs. Ethan saw schools, shops, and a small square where families had gathered for celebrations. “What happened to everyone?” Ethan asked. “Some moved to the city. Others built new homes farther up the mountain. A few never returned.” Ethan spent the next day exploring the ruins. He photographed the remaining buildings and listened to stories from people who still remembered village life. When he returned home, he created a website about the abandoned settlement. He included historical photographs, interviews, and information about the families who had lived there. Unexpectedly, descendants of former residents began contacting him. Some had never heard the full story of their ancestors. Ethan's vacation project became a community archive. He had traveled to discover a beautiful village, but he returned with something more valuable: a collection of memories that might otherwise have disappeared.", "pb": [32, 65, 80, 99, 123, 129, 146, 170, 196, 214, 221], "m": ["village", "mountain", "cloudrain"]}, {"id": "t19", "lv": "Pré-intermediário", "title": "The Perfect Plan", "body": "Jessica loved making plans. She had a calendar for work, a notebook for personal goals, and a spreadsheet for her monthly expenses. She believed that careful planning could prevent almost every problem. When she organized a weekend trip with three friends, she prepared a detailed schedule. Every restaurant was booked, every attraction had a time slot, and even the walking routes were planned. On Saturday morning, everything went wrong. Their train was delayed, the weather changed suddenly, and the restaurant lost their reservation. Jessica became increasingly frustrated. She kept checking her schedule and trying to find alternatives, while her friends suggested simply enjoying the day. Eventually, they entered a small bookshop to escape the rain. The owner recommended a nearby café that served excellent homemade food. After lunch, they discovered a local art exhibition that none of them had known about. They spent two hours exploring it and talking to the artists. That evening, they sat beside a lake and watched the sunset. “This was not in my plan,” Jessica admitted. Her friend laughed. “Maybe that is why it was so good.” Jessica realized that she had spent so much energy trying to control the weekend that she had almost forgotten to enjoy it. When she returned home, she did not throw away her calendars or spreadsheets. She still believed planning was useful. However, she began leaving space in her schedules for unexpected opportunities. For the first time, she understood that a good plan did not need to predict everything. It only needed to help her make the most of whatever happened.", "pb": [22, 32, 63, 83, 105, 126, 152, 163, 171, 182, 204, 223, 234, 250], "m": ["clock", "compass", "star"]}, {"id": "t20", "lv": "Pré-intermediário", "title": "The Letter from Tomorrow", "body": "On Monday morning, Michael found an envelope under his apartment door. His name was written on the front, but there was no address or stamp. Inside, he discovered a short letter. “Dear Michael, tomorrow you will receive an opportunity that scares you. Do not reject it immediately. You will regret it.” Michael laughed. Someone was clearly playing a joke on him. The following day, his manager called him into the office and offered him a promotion. The new position required moving to another city and leading a much larger team. Michael had always wanted career growth, but the thought of leaving his friends and familiar surroundings frightened him. He remembered the mysterious letter. Instead of saying no immediately, he asked for two days to consider the offer. He spoke to his family, calculated the financial changes, and researched the new city. Slowly, he began to see the advantages. On Thursday, he accepted the promotion. Before leaving his apartment that evening, he noticed another envelope under the door. It contained a second letter. “You made the right decision. Remember that courage does not mean feeling no fear. It means refusing to let fear make every decision for you.” Michael looked around the empty hallway, wondering who had written the letters. He never discovered the answer. Years later, when he was mentoring a younger colleague who was afraid of taking a risk, he wrote a letter of his own. He placed it under the colleague's door. It began, “Dear future you...”", "pb": [25, 31, 51, 61, 90, 108, 113, 127, 148, 154, 167, 172, 197, 209, 214, 237, 244], "m": ["envelope", "clock", "star"]}, {"id": "t21", "lv": "Intermediário superior", "title": "The Man Who Collected Silence", "body": "Every Sunday, Martin disappeared into the countryside with a notebook and a thermos of coffee. His neighbors assumed he was a lonely man with an unusual hobby, but Martin had a very specific purpose: he was collecting silence. He had spent thirty years working as a sound engineer in a busy city. His days were filled with ringing phones, crowded streets, and endless meetings. Eventually, the noise became unbearable, and he retired earlier than planned. At first, silence made him uncomfortable. He kept turning on the television simply to fill the empty rooms. Gradually, however, he began to appreciate the sounds that remained: wind moving through the grass, distant birds calling to one another, and rain tapping against the windows. He started recording these sounds and writing about how they made him feel. One afternoon, a young journalist approached him in a field. “Why record silence?” she asked. “Isn't silence simply the absence of sound?” Martin smiled. “Not at all. Silence gives other things a chance to be heard.” The journalist stayed for an hour, listening to the recordings. Before leaving, she asked whether he would consider sharing his collection with the public. Several months later, Martin's recordings became part of an exhibition about modern life and mental exhaustion. Visitors sat in a dark room, listening to the quiet sounds of distant landscapes. Martin attended the opening but remained near the exit, uncomfortable with the attention. For once, he had nothing to say. And for once, nobody expected him to.", "pb": [38, 75, 120, 133, 143, 155, 157, 169, 193, 209, 223, 236, 243], "m": ["volumeoff", "tree", "book"]}, {"id": "t22", "lv": "Intermediário superior", "title": "The Inheritance Nobody Wanted", "body": "When the lawyer announced that three siblings had inherited an abandoned hotel, their first reaction was disappointment. The building was in terrible condition, the roof leaked whenever it rained, and the heating system had stopped working years earlier. Their father had owned the hotel but had never explained why he refused to sell it. Daniel wanted to sell the property immediately. Rebecca believed they should renovate it, while Thomas suggested turning it into affordable accommodation for travelers. Their disagreements grew increasingly bitter. Each sibling accused the others of being selfish or unrealistic. One afternoon, while clearing out the manager's office, Rebecca discovered a collection of guestbooks. The earliest entries dated back more than sixty years. She began reading them and found stories of families who had stayed at the hotel during difficult periods in their lives. One couple had met there during a snowstorm. Another guest had written that the hotel was the first place where he had felt welcome after leaving his home country. Rebecca shared the entries with her brothers. For the first time, they understood that their father had not simply owned a building. He had protected a place where strangers could find comfort. They decided to investigate whether renovation was financially possible. After months of work, they secured a small business loan and reopened part of the hotel. The project was more expensive than expected, and they occasionally questioned their decision. Still, on opening night, an elderly guest arrived carrying an old photograph. “I stayed here with my parents in 1972,” she said. “I never thought I would see this place again.” Daniel looked at his siblings and smiled. The inheritance had not made them rich. It had given them something to build together.", "pb": [38, 54, 77, 92, 115, 165, 172, 197, 222, 235, 247, 266, 273, 280], "m": ["key", "house", "lock"]}, {"id": "t23", "lv": "Intermediário superior", "title": "A Reputation for Being Difficult", "body": "At the advertising agency where Claire worked, people described her as brilliant but difficult. She noticed mistakes that others overlooked, challenged weak arguments, and refused to approve projects she considered poorly designed. Her colleagues respected her expertise but often avoided asking for her opinion. Claire believed she was simply being honest. Why should she pretend an idea was good when it clearly wasn't? The situation changed when the agency lost an important client. During the internal review, the director explained that the client had felt dismissed during meetings. “They didn't think you understood their concerns,” he told Claire. She was defensive at first. She had prepared detailed reports and offered practical solutions. Surely that should have been enough. However, she began reviewing recordings of the meetings. To her surprise, she noticed how frequently she interrupted people and how quickly she rejected suggestions before hearing them completely. Her criticism was often accurate, but her delivery made others unwilling to cooperate. Over the following weeks, Claire made a deliberate effort to ask questions before offering opinions. Instead of saying, “That won't work,” she began asking, “What would need to change for this to work?” The difference was remarkable. Discussions became more productive, and colleagues started sharing ideas they had previously kept to themselves. Claire did not lower her standards. She still challenged assumptions and demanded careful work. She simply learned that being right and being effective were not the same thing. Her reputation changed gradually, not because she became less demanding, but because people finally felt that she was demanding things with them rather than against them.", "pb": [32, 44, 63, 88, 98, 118, 146, 159, 192, 211, 225, 239], "m": ["chat", "friend", "scales"]}, {"id": "t24", "lv": "Intermediário superior", "title": "The Island of Forgotten Names", "body": "The island appeared on no modern tourist map. It was a narrow stretch of land surrounded by cliffs, accessible only when the tide was low. Nora discovered it while researching an old maritime accident. According to a newspaper article from 1911, several survivors had reached the island, yet their names had never appeared in official records. Intrigued, she traveled to the nearest coastal village and interviewed residents. Most dismissed the story as an old legend, but a retired schoolteacher directed her to a neglected archive in the town hall. There, Nora found a handwritten diary belonging to a lighthouse keeper. Its final pages described a group of exhausted travelers arriving on the island during a violent storm. The keeper had sheltered them for several days. He recorded their names, occupations, and the places they hoped to reach. Yet someone had crossed out every name in the diary. Nora wondered whether the survivors had deliberately hidden their identities. After comparing the diary with immigration records, she discovered that several people had arrived in a neighboring country shortly afterward under different names. Some appeared to have escaped political persecution. The discovery transformed her research. What initially seemed like a forgotten maritime mystery became a story about people who had risked everything to begin again. Nora published her findings, taking care not to reveal information that might expose living descendants to harm. The island remained physically unchanged. But the people who had once disappeared from history were no longer entirely forgotten.", "pb": [25, 56, 89, 117, 147, 157, 187, 212, 229, 234], "m": ["island", "wave", "compass"]}, {"id": "t25", "lv": "Intermediário superior", "title": "The Algorithm That Knew Too Much", "body": "When software developer Adrian helped create a recommendation system for a large online retailer, he was proud of its accuracy. The program analyzed customers' browsing habits and suggested products they were likely to purchase. Within months, sales increased significantly. Then Adrian noticed something disturbing. The system had begun recommending expensive products to customers who appeared financially vulnerable. It was not explicitly programmed to exploit anyone; it had simply learned that certain patterns predicted impulsive purchases. The management team dismissed his concerns. “The algorithm is doing exactly what we designed it to do,” one executive argued. “Our job is to increase sales.” Adrian disagreed. A system could perform perfectly according to its technical objective while producing harmful results in the real world. He proposed adding safeguards, including limits on certain recommendations and clearer explanations of why products appeared in customers' feeds. The changes would reduce short-term revenue, and his proposal was rejected. Adrian faced a difficult choice. He could remain silent and protect his career, or challenge a decision supported by senior executives. He began documenting the system's behavior and presented the evidence to the company's ethics committee. The investigation took months. Eventually, the company introduced new policies and independent reviews. Adrian received little public recognition, and several colleagues considered him unnecessarily troublesome. Still, he felt relieved. He had learned that technical competence alone was insufficient. People who build powerful systems must also consider the consequences of their decisions. The algorithm had never intended to hurt anyone. That was precisely why someone needed to take responsibility for it.", "pb": [34, 39, 75, 81, 101, 121, 151, 172, 187, 200, 212, 216, 238, 246], "m": ["chip", "eye", "lock"]}, {"id": "t26", "lv": "Intermediário superior", "title": "A City Beneath the City", "body": "During repairs to an underground railway station, workers discovered a staircase hidden behind a concrete wall. The steps led to a network of narrow corridors that appeared to predate the modern city above them. Archaeologist Elena was called to examine the discovery. At first, she believed the tunnels had once served as storage rooms. However, the walls contained faded paintings, carved symbols, and marks that suggested people had lived there. As excavations continued, the team uncovered pottery, children's toys, and fragments of handwritten documents. The objects indicated that the underground settlement had been occupied during a period of severe political unrest centuries earlier. Elena's most remarkable discovery was a small room containing dozens of clay tablets. Their inscriptions described a community that had hidden underground to escape persecution. The tablets also revealed that the inhabitants had created an organized system of food distribution, education, and medical care. Elena became increasingly convinced that the tunnels represented more than a temporary refuge. They were evidence of a society that had adapted to survive under extraordinary circumstances. The discovery attracted international attention, and city officials proposed turning the site into a tourist attraction. Elena supported public access but warned against sacrificing the settlement's historical integrity for commercial appeal. “People should understand what happened here,” she argued, “not simply take photographs and leave.” After months of debate, the city agreed to preserve the central chambers and build a carefully designed museum around them. The underground city had survived for centuries beneath the noise of modern life. Now, its inhabitants could finally tell their story.", "pb": [34, 70, 103, 128, 147, 174, 190, 205, 219, 239, 252], "m": ["city", "train", "key"]}, {"id": "t27", "lv": "Intermediário superior", "title": "The Cost of Winning", "body": "For years, Marcus had measured his life through victories. He wanted the highest salary, the fastest promotion, and the strongest reputation in his industry. He worked late, competed aggressively, and treated every disagreement as a challenge to overcome. Eventually, his strategy worked. At thirty-five, he became the youngest director in his company's history. The promotion brought financial security and professional recognition, but it also exposed the weaknesses in his personal life. His closest friends had stopped inviting him out because he routinely canceled plans. His younger brother rarely called, and his partner had begun questioning whether their relationship had a future. Marcus insisted that the sacrifices were temporary. Once he reached the next stage of his career, he promised himself, things would improve. Then his father suffered a serious accident. Marcus flew home immediately, expecting to spend a few days helping his family before returning to work. Instead, the recovery required several weeks of care and frequent hospital visits. During that period, he met people whose lives had taken unexpected turns. A former executive was learning to walk again. A retired teacher was rebuilding her life after losing her husband. None of them seemed particularly interested in professional status. One evening, his father asked him a simple question. “What are you working so hard to become?” Marcus had no immediate answer. He returned to work eventually, but he changed how he measured progress. He protected time for family, delegated more responsibilities, and stopped treating exhaustion as proof of commitment. He remained ambitious. He simply stopped assuming that every victory was worth its price.", "pb": [24, 38, 53, 101, 123, 130, 159, 199, 208, 216, 221, 249, 252], "m": ["trophy", "scales", "heart"]}, {"id": "t28", "lv": "Intermediário superior", "title": "The Translator's Mistake", "body": "Isabel had worked as a professional translator for twelve years when she was assigned a document that could influence a major international agreement. The text contained a phrase in a regional dialect that had no exact equivalent in the target language. Isabel researched the expression carefully and consulted two specialists, but both offered slightly different interpretations. Under pressure to meet the deadline, she selected the interpretation that seemed most consistent with the surrounding paragraphs. The agreement was signed. Several weeks later, representatives from one of the participating organizations complained that a key obligation had been misunderstood. An internal review revealed that Isabel's translation had contributed to the confusion. She was devastated. Her reputation depended on accuracy, and she had always taken pride in her attention to detail. Her manager initially considered removing her from the project. Instead, Isabel requested a meeting with the representatives and explained the ambiguity honestly. She did not attempt to defend every decision she had made. She described the alternatives she had considered and acknowledged that she should have flagged the uncertainty more clearly. The parties agreed to revise the relevant clause and establish a review procedure for culturally specific expressions. The incident changed Isabel's professional practice. She began marking uncertain passages explicitly and explaining when a translation involved interpretation rather than a direct equivalent. She also started training junior translators to recognize the limits of literal accuracy. Isabel learned that expertise did not mean eliminating uncertainty. It meant knowing when uncertainty mattered enough to demand further discussion.", "pb": [23, 56, 74, 78, 108, 127, 149, 178, 195, 219, 232, 241], "m": ["globe", "chat", "book"]}, {"id": "t29", "lv": "Intermediário superior", "title": "The House at the End of Winter", "body": "The house stood at the end of a narrow road, surrounded by pine trees and fields that remained frozen for much of the winter. Locals called it the House of Echoes because visitors sometimes claimed to hear voices inside its empty rooms. When journalist Samuel arrived, he expected to find a collection of exaggerated stories. The owner, a retired music teacher named Evelyn, had agreed to speak with him before the property was sold. Inside, Samuel discovered hundreds of handwritten musical scores. Some were familiar compositions, while others appeared to be original works that had never been published. Evelyn explained that her late husband, Thomas, had spent decades composing music but had never felt confident enough to share it. “Why did he keep everything hidden?” Samuel asked. “He was afraid people would hear the imperfections,” she replied. “He wanted his music to be perfect before anyone heard it.” After Thomas died, Evelyn found herself unable to enter the music room. Every instrument reminded her of conversations they had never finished. Samuel's article initially focused on the mysterious house, but he became more interested in the unpublished music. He contacted a local orchestra, whose director agreed to perform several compositions. At the concert, Evelyn sat in the front row. When the final piece ended, the audience remained silent for a moment before applauding. She began to cry. The house was eventually sold, and its rooms were renovated. Yet Thomas's music continued to be performed. Samuel realized that the house had not been haunted by ghosts. It had been haunted by unfinished possibilities.", "pb": [42, 74, 98, 119, 127, 148, 170, 199, 222, 226, 243, 254], "m": ["house", "snow", "sun"]}, {"id": "t30", "lv": "Intermediário superior", "title": "The Day Everyone Told the Truth", "body": "The experiment began as a joke during a dinner party. Someone suggested that everyone should spend twenty-four hours telling the truth, regardless of the consequences. By midnight, the group had agreed to try it. The next morning, small confessions began appearing in their conversations. One friend admitted that he disliked the expensive restaurant they visited every month. Another confessed that she had accepted a promotion she did not really want. As the day progressed, the consequences became more complicated. Daniel told his business partner that their company was losing money because he had been avoiding difficult decisions. His partner was furious, but the conversation eventually revealed several problems they could address together. Meanwhile, Sophie told her sister that she felt overwhelmed by being expected to organize every family event. Her sister had assumed Sophie enjoyed doing it and immediately offered to share the responsibility. Not every conversation ended well. One man admitted that he had been hiding an important financial mistake from his wife. Their argument lasted hours, and the trust between them would take time to rebuild. That evening, the group met again. They agreed that honesty was not simply a matter of saying whatever came to mind. Truth could be delivered carelessly, used as a weapon, or expressed with compassion. The experiment ended at midnight, but its effects continued. Some friendships grew stronger. Others became more complicated. Nobody agreed to repeat the challenge. They had discovered that truth was powerful, but power alone did not make something wise.", "pb": [25, 34, 70, 79, 112, 144, 178, 184, 212, 221, 229, 235], "m": ["eye", "chat", "scales"]}, {"id": "t31", "lv": "Avançado", "title": "The Museum of Unlived Lives", "body": "The museum occupied a narrow building between a pharmacy and a restaurant, yet its exhibitions attracted visitors from around the world. Unlike conventional museums, it displayed no historical artifacts, celebrated no famous figures, and offered no account of events that had actually occurred. Instead, it preserved the lives people might have lived. In the first gallery, visitors encountered a woman who had abandoned her musical ambitions to raise a family. In another, they met a man who had remained in his hometown rather than accepting a position overseas. Each exhibition described an alternative existence with such precision that visitors often emerged visibly unsettled. Mara, a journalist investigating the institution, was skeptical of its claims. How could anyone know what an individual's life might have become after a different decision? The museum's director, Dr. Vale, offered no straightforward explanation. “We do not claim to predict the future,” he said. “We examine the possibilities people carry with them.” Mara was given access to a private exhibition devoted to her own life. It described a version of herself who had become a novelist instead of pursuing journalism. The woman in the exhibition had published three acclaimed books, but she had also become estranged from her family. Mara was disturbed by how plausible the account seemed. “Is this supposed to be a warning?” she asked. “Not necessarily,” Dr. Vale replied. “Regret is often the belief that one alternative would have spared us every difficulty.” Before leaving, Mara asked whether the museum preserved every possible life. “Of course not,” he said. “There are too many.” Outside, the city continued as usual. Mara walked toward the station, uncertain whether the experience had revealed anything about her past. Perhaps its value lay elsewhere: in reminding her that the life she had chosen was neither inevitable nor beyond revision.", "pb": [43, 52, 103, 129, 138, 156, 203, 212, 221, 240, 251, 260, 281], "m": ["columns", "frame", "hourglass"]}, {"id": "t32", "lv": "Avançado", "title": "The Architecture of Deception", "body": "When the government commissioned architect Elias Mercer to design a new civic building, the brief emphasized transparency. The structure was to embody democratic accountability, welcoming citizens into a space where public decisions could be examined and challenged. Mercer approached the assignment with characteristic ambition. He designed vast windows, open meeting chambers, and corridors that allowed visitors to see almost every department at work. The building received international recognition before construction was complete. Yet as the project progressed, Mercer noticed a contradiction. Behind the transparent façade, officials were requesting private offices, restricted entrances, and increasingly elaborate security arrangements. The architecture suggested openness, while the institution itself was becoming more difficult to access. He raised his concerns with the project committee. “Transparency is not achieved by installing glass,” he argued. “It depends on whether people can actually see how decisions are made.” The committee acknowledged his point but insisted that confidentiality was necessary for effective administration. Mercer faced a professional dilemma. If he withdrew, the building would proceed without him. If he stayed, his reputation would lend credibility to a design that no longer reflected its original purpose. He eventually negotiated several changes, including publicly accessible records rooms and spaces for independent oversight. However, the restricted offices remained. At the opening ceremony, officials praised the building as a triumph of democratic design. Mercer listened politely, conscious of the compromises embedded in its walls. Years later, a journalist asked whether he considered the project a success. “It is a beautiful building,” he replied. “Whether it is an honest one depends on what happens inside.” The answer disappointed those who wanted a simple verdict. Mercer had learned that architecture could make a promise, but only institutions could decide whether to keep it.", "pb": [37, 63, 72, 111, 119, 140, 154, 186, 206, 231, 243, 261, 270], "m": ["city", "lock", "eye"]}, {"id": "t33", "lv": "Avançado", "title": "The Last Honest Broker", "body": "For nearly four decades, Miriam Shaw had negotiated agreements between companies that distrusted one another. She had settled labor disputes, arranged international partnerships, and prevented several commercial rivalries from becoming legal battles. Her greatest strength was not persuasion in the conventional sense. She listened until each party felt understood, then identified the assumptions preventing them from reaching an agreement. When she announced her retirement, a technology firm approached her with an unusual request. Its executives wanted her to mediate a dispute with a smaller competitor whose software allegedly infringed on a proprietary system. Miriam reviewed the documents and quickly noticed that the larger company's position rested on an uncertain interpretation of its own patent. A successful legal challenge could cost it considerably more than a negotiated settlement. She explained this to the executives, who responded by questioning her loyalty. “We hired you to secure an advantage,” the chief executive said, “not to undermine our position.” Miriam replied that an advantage built on a false premise was unlikely to survive scrutiny. The company dismissed her and hired another consultant, who recommended aggressive litigation. Eighteen months later, the case collapsed after a court rejected the patent interpretation. Miriam heard the news without satisfaction. She had predicted the outcome, but prediction was not the same as preventing harm. Her former client eventually contacted her again, this time seeking advice on restructuring its legal strategy. She declined the invitation. “I spent my career helping people distinguish what they wanted to be true from what they could actually defend,” she told the executive. “I no longer wish to spend my time explaining the difference twice.” She left the profession quietly, without a memoir or a farewell tour. Her reputation endured, partly because she had understood something her clients frequently forgot: credibility is easiest to spend when it is hardest to replace.", "pb": [32, 59, 93, 127, 139, 155, 170, 195, 215, 231, 235, 270, 282], "m": ["scales", "briefcase", "friend"]}, {"id": "t34", "lv": "Avançado", "title": "A Theory of Ordinary Miracles", "body": "Professor Anika Rao had spent twenty years studying improbable coincidences. Her colleagues regarded the subject as intellectually entertaining but scientifically marginal, a collection of anecdotes that people interpreted as meaningful because they disliked randomness. Anika agreed that human beings were excellent at finding patterns, including patterns that did not exist. Nevertheless, she suspected that the psychological mechanisms behind coincidence deserved closer examination. Her research began with interviews. Participants described meeting strangers who had appeared in their dreams, receiving unexpected messages during moments of crisis, or discovering long-forgotten objects precisely when they needed them. Anika recorded the accounts without endorsing their interpretations. She wanted to understand not whether the universe arranged these events, but why certain coincidences transformed the people who experienced them. One participant, a widower named Samuel, described finding a postcard written by his wife shortly before her death. It had slipped behind a drawer and remained undiscovered for years. The message contained an ordinary reminder to buy bread, yet Samuel said its discovery had helped him begin grieving. There was no evidence of anything supernatural. Still, dismissing the experience as meaningless seemed equally inadequate. Anika eventually published a paper arguing that an event's emotional significance need not depend on an extraordinary explanation. Coincidences could become turning points because people incorporated them into the stories they told about their lives. The paper attracted criticism from researchers who feared she was encouraging irrational thinking. She responded by distinguishing between evidence and meaning. “An experience can matter profoundly,” she wrote, “without proving the explanation we attach to it.” Anika never abandoned scientific skepticism. She simply became more interested in the complicated territory where objective events meet subjective lives. Not every miracle requires a violation of natural law. Sometimes, the extraordinary part is what an ordinary event enables someone to see.", "pb": [34, 62, 93, 122, 170, 186, 221, 234, 242, 257, 277, 286], "m": ["star", "book", "sun"]}, {"id": "t35", "lv": "Avançado", "title": "The Republic of Small Decisions", "body": "In the coastal republic of Bellmare, political scientists had long struggled to explain why its citizens rarely protested against corruption despite widespread dissatisfaction. Elections remained competitive, newspapers published investigations, and public opinion surveys showed little confidence in the government. Yet demonstrations were infrequent, and meaningful reform proceeded painfully slowly. When researcher Julian Mercer arrived to investigate, he expected to find a population intimidated by authority. Instead, he discovered a society organized around countless small acts of accommodation. Shopkeepers paid unofficial fees to avoid inspections. Managers hired relatives of influential officials. Citizens who criticized public services privately relied on personal connections to bypass the same services they condemned. None of these decisions seemed decisive in isolation. Together, however, they maintained a system that nearly everyone claimed to dislike. Julian interviewed a civil servant named Elena, who explained that refusing to cooperate with corruption could place an entire family at a disadvantage. “People ask why we do not change the system,” she said. “But the system is also the collection of decisions we make to survive it.” Her observation complicated Julian's initial hypothesis. The problem was not simply that citizens lacked courage. Many faced genuine economic risks, and individual acts of resistance could impose severe costs without producing visible change. His final report therefore rejected the comforting distinction between corrupt institutions and innocent citizens. It examined how incentives, fear, habit, and rational self-interest reinforced one another. The report recommended reforms that reduced the cost of honest behavior rather than relying exclusively on punishment. Years later, Bellmare introduced several of these measures. Progress was uneven, and corruption did not disappear. Julian nevertheless considered the reforms significant. He had learned that collective failure rarely requires every participant to be malicious. Sometimes, a system survives because thousands of reasonable people make individually understandable choices whose combined consequences are disastrous.", "pb": [39, 49, 77, 107, 127, 150, 175, 208, 234, 251, 267, 273], "m": ["columns", "scales", "compass"]}, {"id": "t36", "lv": "Avançado", "title": "The Cartographer of Memory", "body": "After her mother's death, Celia inherited a collection of hand-drawn maps. They depicted places that existed in no atlas: a garden that had been demolished before Celia was born, a railway platform where her parents had first met, and a narrow street where her mother had once lived as a child. Each map included annotations describing smells, conversations, and fragments of remembered experience. Some streets were labeled according to the people who had occupied them rather than their official names. Celia initially regarded the collection as an eccentric hobby. Then she noticed that the maps contradicted one another. A house appeared on one drawing but vanished from another. Distances changed, and familiar buildings occupied different positions. She consulted a historian, who explained that memory rarely preserves spatial relationships with cartographic precision. “Your mother was not documenting geography,” he said. “She was documenting the way places survived inside her.” Celia began interviewing relatives and comparing their recollections. The results were fascinating and frustrating. Her uncle remembered a childhood garden as enormous, while her aunt insisted it had been barely large enough for a table. Both described the same summer with complete confidence. Rather than correcting every inconsistency, Celia created a digital archive containing the different versions. Visitors could explore the maps, listen to family interviews, and see how individual memories overlapped or diverged. The project became an unexpected portrait of a family across several generations. Celia never produced a single definitive map of her mother's life. Instead, she preserved the contradictions. She came to understand that memory was less like a photograph than a city continually rebuilt by those who lived in it. Its landmarks remained recognizable, but their meaning shifted with every return.", "pb": [51, 80, 116, 131, 148, 191, 205, 222, 234, 245, 250], "m": ["compass", "frame", "book"]}, {"id": "t37", "lv": "Avançado", "title": "The Negotiation of Winter", "body": "The negotiations began in November, when the northern province of Ardin experienced its harshest winter in half a century. A dispute between the regional government and the private company controlling its heating infrastructure had left thousands of residents facing uncertain energy supplies. Both sides claimed to be protecting the public. The government demanded lower prices and greater oversight, while the company argued that the proposed restrictions would make essential maintenance financially impossible. Elise Moreau, an independent mediator, was appointed after three previous rounds of talks had failed. Her first task was to separate the parties' public positions from their underlying concerns. Government officials feared political humiliation if they appeared to concede. Company executives feared that accepting temporary price controls would establish a precedent for permanent interference. Elise proposed a confidential session in which neither side would need to defend its position before the press. The meeting revealed an unexpected area of agreement: both parties accepted that the infrastructure required immediate investment, but neither wanted to bear the entire cost. Elise constructed a proposal combining temporary public subsidies, independent financial audits, and a phased reduction in consumer prices. The arrangement was imperfect, and several provisions required further negotiation. Nevertheless, both parties accepted it. When journalists asked Elise who had won, she refused to name a victor. “An agreement is not necessarily evidence that either side was wrong,” she explained. “It may simply mean that both have discovered the cost of remaining right.” The heating supply stabilized before the coldest weeks arrived. Months later, the parties continued arguing over implementation details, as Elise had expected. Cooperation had not eliminated their conflicting interests. It had made those interests manageable. Elise regarded that distinction as the foundation of serious negotiation: not the disappearance of disagreement, but the creation of conditions under which disagreement no longer made progress impossible.", "pb": [42, 72, 87, 126, 144, 169, 197, 202, 215, 241, 250, 270, 276], "m": ["snow", "briefcase", "scales"]}, {"id": "t38", "lv": "Avançado", "title": "The Man Who Refused to Be Remembered", "body": "When historian Peter Lang began researching the anonymous donations that had financed several public libraries, he expected to uncover a wealthy benefactor who preferred discretion to publicity. Instead, the financial records led him to Arthur Bell, a retired accountant living in a modest apartment above a grocery store. Bell had donated almost half his earnings over thirty years. His contributions had supported literacy programs, rural libraries, and scholarships for students who could not afford university. Yet he had refused every request to attend ceremonies or allow his name to appear on plaques. Peter asked him why. “Because the work matters more than the person who pays for it,” Bell replied. The historian was intrigued. In an era when philanthropy often involved carefully managed public images, Bell's anonymity seemed almost defiant. During subsequent interviews, Peter discovered that Bell had grown up in a household where books were scarce. A librarian had once allowed him to borrow additional volumes without charge, an act that helped him pass an important examination. Bell had never forgotten the experience. “I cannot repay that woman,” he explained. “I can only make similar opportunities available to someone else.” Peter's publisher wanted a dramatic biography, complete with photographs and a public revelation. Bell agreed to the interview but refused to approve the proposed publicity campaign. The historian faced a dilemma. Revealing Bell's identity might inspire other donors, but it would violate the very principle that had guided his generosity. Peter eventually published an article about the libraries and the people who benefited from them, omitting Bell's name. The story attracted attention without turning the donor into its central character. Years later, Peter wondered whether he had sacrificed a compelling historical portrait. Then he received a letter from a scholarship recipient who had become a librarian. She had never heard of Arthur Bell. She simply wanted to support another student.", "pb": [27, 48, 75, 92, 96, 110, 130, 168, 174, 191, 217, 241, 259, 271, 283, 297, 304], "m": ["frame", "hourglass", "lock"]}, {"id": "t39", "lv": "Avançado", "title": "The Ethics of Forgetting", "body": "When a new medical technology made it possible to selectively weaken painful memories, public debate quickly divided into two opposing camps. Supporters described it as a breakthrough for people trapped by traumatic experiences. Critics warned that altering memory could undermine personal identity and accountability. Dr. Naomi Ellis, a neuroscientist involved in early clinical trials, found both positions incomplete. Memory was not a permanent recording of the past. Each act of recollection involved a degree of reconstruction, and emotional responses could change as memories were revisited. The treatment did not erase events; it reduced the intensity of certain associated reactions. Nevertheless, the ethical questions were formidable. During one trial, a participant named David asked whether the treatment would change his feelings of guilt about an accident he had caused years earlier. He wanted relief from the recurring distress but feared becoming indifferent to the suffering of others. Naomi explained that no one could guarantee exactly how he would experience the outcome. David postponed the procedure. His decision challenged Naomi's assumption that reducing suffering was always the primary objective of treatment. For some people, painful memories were inseparable from moral commitments, personal growth, or the recognition of harm done to others. She began advocating for more comprehensive counseling before and after treatment, including discussions about the meanings patients attached to their memories. The approach was slower and more expensive, and some researchers criticized it as unnecessarily cautious. Naomi remained unconvinced that technical capability alone could determine ethical desirability. A memory could be burdensome without being worthless, and relief could be beneficial without being uncomplicated. The central question was not whether people should remember everything. It was whether they should be given the opportunity to decide, with adequate understanding, what kind of relationship they wished to have with their past.", "pb": [44, 58, 99, 105, 146, 160, 164, 199, 220, 235, 246, 262, 272], "m": ["scales", "hourglass", "heart"]}, {"id": "t40", "lv": "Avançado", "title": "The Library at the End of Time", "body": "The library was discovered beneath the foundations of a research facility that had been abandoned after an unexplained power failure. Its entrance was sealed behind a wall of reinforced glass, and the temperature inside remained constant despite the years of neglect. When the first expedition entered, researchers found thousands of books arranged along circular shelves. None bore publication dates, and many described events that had not yet occurred. At first, the discovery was treated as an elaborate hoax. Then investigators located a volume describing a scientific conference scheduled for the following year, including an argument between two researchers who had not yet met. The library appeared to contain records of possible futures. Dr. Lena Voss, the expedition's director, prohibited the public release of its contents until the team understood the implications. If people could read accounts of events before they happened, even uncertain predictions might influence the decisions they were intended to describe. One evening, Lena discovered a book bearing her own name. Its final chapter described her decision to destroy the library after concluding that its existence threatened human freedom. She could not determine whether the account was a prediction, a warning, or simply one possibility among countless others. The next morning, the team debated what to do. Some argued that the knowledge could prevent disasters. Others feared that governments and corporations would use it to manipulate entire populations. Lena ordered the expedition to stop copying the books. She did not destroy the library, as the volume had suggested. Instead, she sealed the entrance and published a report describing the discovery without revealing its contents. Years later, critics accused her of withholding information that might have benefited humanity. Lena never disclosed what she had read in the final chapter. Perhaps she had changed the future. Perhaps the book had always described a different possibility.", "pb": [41, 68, 103, 112, 153, 181, 200, 230, 239, 266, 279, 290, 296], "m": ["books", "hourglass", "star"]}];

const idxAt=(x,y)=>{const e=document.elementFromPoint(x,y);return spans.indexOf(e&&e.closest?e.closest(".w"):null)};

 flip=false;const box=$("#cards");
 if(rv.done||!rv.q.length){box.innerHTML=`<div class="card bk">Concluído!<small>${rv.first} de ${rv.n} corretas de primeira</small></div><button class="btn pri big" id="again" style="margin-top:14px">Revisar de novo</button>`;$("#again").onclick=()=>{startRv(keys);render()};return}
 const e=rv.q[0];
 box.innerHTML=`<p class="mu" style="margin:0 0 10px">${rv.q.length} para revisar</p><div class="scene" id="sc"><div class="flipper" id="cd"><div class="face">${e}<small>English · toque na carta</small></div><div class="face back">${ws[e]||"sem tradução"}<small>Português</small></div></div></div><div class="row ans" id="ans"><button class="btn big" id="bad">${ico("x")}Errei</button><button class="btn pri big" id="ok">${ico("check")}Acertei</button></div>`;
 $("#cd").onclick=()=>{flip=!flip;$("#cd").classList.toggle("fl",flip);$("#ans").classList.toggle("on",flip);const sc=$("#sc");sc.classList.remove("hop");void sc.offsetWidth;sc.classList.add("hop")};
 $("#ok").onclick=()=>ans(e,true);$("#bad").onclick=()=>ans(e,false)}
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<16;i++){const p=document.createElement("i");p.className="cf";const a=Math.random()*6.28,d=70+Math.random()*100;p.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;background:${["#ff6a00","#111","#fff","#ffb27a"][i%4]}`;document.body.append(p);setTimeout(()=>p.remove(),700)}}
function ans(e,good){if(rv.lock)return;rv.lock=1;const f=!rv.seen[e];rv.seen[e]=1;const S=(stats[cur.id]=stats[cur.id]||{});const t=(S[e]=S[e]||{ok:0,bad:0});good?t.ok++:t.bad++;persistStats();
 rv.q.shift();if(good){if(f)rv.first++}else rv.q.push(e);flip=false;if(!rv.q.length)rv.done=true;
 const sc=$("#sc");if(sc){sc.classList.add(good?"ok":"no");if(good){burst(sc);try{navigator.vibrate(25)}catch(x){}}}
 setTimeout(()=>{rv.lock=0;render()},good?450:420)}
let pi=0,pr={},listening=false,rec=null;
P.mic='<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>';
const SRc=window.SpeechRecognition||window.webkitSpeechRecognition;
let NSR=null;try{NSR=(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.SpeechRecognition)||null}catch(e){__rep("plugin: "+e.message)}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function say(t){if(useN()){try{NTX().stop();NTX().speak({text:t,lang:"en-US",rate:.85,pitch:1,volume:1,category:"playback"}).catch(()=>{})}catch(e){}return}if(!tts)return;tts.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;tts.speak(u)}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function grade(sent,said){const T=sent.split(" ").map(clean),H=said.split(/\s+/).map(clean).filter(Boolean),n=T.length,m=H.length;
 const c=(i,j)=>T[i-1]===H[j-1]?0:(T[i-1].length>=4&&H[j-1].length>=4&&lev(T[i-1],H[j-1])<=1?4:10);
 const D=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=1;i<=n;i++)D[i][0]=i*10;for(let j=1;j<=m;j++)D[0][j]=j*10;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j-1]+c(i,j),D[i-1][j]+10,D[i][j-1]+10);
 const st=Array(n).fill("bad");let i=n,j=m;
 while(i>0){if(j>0&&D[i][j]===D[i-1][j-1]+c(i,j)){const k=c(i,j);st[i-1]=k===0?"ok":k<10?"cl":"bad";i--;j--}else if(D[i][j]===D[i-1][j]+10){i--}else if(j>0){j--}else i--}
 const ok=st.filter(x=>x==="ok").length,cl=st.filter(x=>x==="cl").length;
 return{st,said,score:Math.round((ok+cl*.5)/n*100)}}
function listenWeb(onPart){return new Promise((res,rej)=>{const r=new SRc();r.lang="en-US";r.interimResults=true;r.continuous=false;let t="";
 r.onresult=e=>{t="";for(const x of e.results)t+=x[0].transcript+" ";onPart(t)};r.onerror=e=>rej(e.error||"erro");r.onend=()=>res(t.trim());rec=r;r.start()})}
async function listenNative(){try{const a=await NSR.available();if(!a.available)throw 0}catch(e){throw"unsupported"}

const errTxt=e=>({"not-allowed":"Microfone bloqueado. Libere a permissão do microfone (se estiver na prévia do Claude, abra a página no Chrome).","service-not-allowed":"Reconhecimento de voz bloqueado neste aparelho.","no-speech":"Não ouvi nada. Fale mais perto do microfone e tente de novo.","network":"Sem internet: o reconhecimento de voz precisa de conexão.","unsupported":"Este aparelho não tem reconhecimento de voz disponível.","audio-capture":"Não encontrei um microfone."}[e]||"Não consegui gravar ("+e+").");

async function toggleRec(sent){
 if(listening){stopRec();return}
 if(!NSR&&!SRc){pmsg("Este navegador não suporta reconhecimento de voz. Use o Chrome ou o app instalado.");return}

 listening=false;
 if(err){if(err!=="aborted"){micUI();pmsg(errTxt(err))}else micUI();return}
 if(!t){micUI();pmsg(errTxt("no-speech"));return}
 (pr[cur.id]=pr[cur.id]||{})[pi]=grade(sent,t);pronView()}

 micUI();
