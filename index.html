<script>
const TEXTS=[
{id:"london",lv:"Iniciante",title:"A Morning in London",body:"Every morning I wake up early and make a cup of tea. I walk to the park near my house. The air is fresh and the birds are singing. Then I take the bus to work and read a book.",
d:{every:"cada / todo",morning:"manhã",i:"eu",wake:"acordar",up:"para cima",early:"cedo",and:"e",make:"fazer",a:"um / uma",cup:"xícara",of:"de",tea:"chá",walk:"caminhar",to:"para",the:"o / a",park:"parque",near:"perto de",my:"meu / minha",house:"casa",air:"ar",is:"é / está",fresh:"fresco",are:"estão",birds:"pássaros",singing:"cantando",then:"então",take:"pegar",bus:"ônibus",work:"trabalho",read:"ler",book:"livro"}},
{id:"rest",lv:"Iniciante",title:"At the Restaurant",body:"Last night we went to a small restaurant. The waiter brought the menu and we ordered pasta and salad. The food was delicious, so we decided to come back next week.",
d:{last:"passado / último",night:"noite",we:"nós",went:"fomos",to:"para",a:"um / uma",small:"pequeno",restaurant:"restaurante",the:"o / a",waiter:"garçom",brought:"trouxe",menu:"cardápio",and:"e",ordered:"pedimos",pasta:"macarrão",salad:"salada",food:"comida",was:"era / estava",delicious:"delicioso",so:"então",decided:"decidimos",come:"vir",back:"de volta",next:"próxima",week:"semana"}}];
const $=s=>document.querySelector(s);
const P={"play": "<path d=\"M7 4.5v15l13-7.5z\"/>", "pause": "<rect x=\"6\" y=\"4\" width=\"4\" height=\"16\" rx=\"1.2\"/><rect x=\"14\" y=\"4\" width=\"4\" height=\"16\" rx=\"1.2\"/>", "stop": "<rect x=\"5\" y=\"5\" width=\"14\" height=\"14\" rx=\"2.5\"/>", "book": "<path d=\"M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z\"/><path d=\"M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z\"/>", "bookmark": "<path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z\"/>", "cards": "<rect x=\"3\" y=\"7\" width=\"14\" height=\"14\" rx=\"2\"/><path d=\"M7 3h12a2 2 0 0 1 2 2v12\"/>", "back": "<path d=\"M19 12H5\"/><path d=\"m12 19-7-7 7-7\"/>", "menu": "<path d=\"M4 7h16M4 12h16M4 17h10\"/>", "home": "<path d=\"m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"/>", "moon": "<path d=\"M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z\"/>", "logout": "<path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"/><path d=\"m16 17 5-5-5-5\"/><path d=\"M21 12H9\"/>", "redo": "<path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"/><path d=\"M3 3v5h5\"/>", "check": "<path d=\"m5 12 5 5L20 7\"/>", "x": "<path d=\"M18 6 6 18M6 6l12 12\"/>"};const F={play:1,pause:1,stop:1};
const ico=n=>'<svg class="ic'+(F[n]?' f':'')+'" viewBox="0 0 24 24" aria-hidden="true">'+P[n]+'</svg>';
let saved={},cur=TEXTS[0],spans=[],offs=[],playing=false,resume=false,sel=null,ci=0,flip=false;
try{saved=JSON.parse(localStorage.getItem("rl_saved")||"{}")}catch(e){}
const persist=()=>{try{localStorage.setItem("rl_saved",JSON.stringify(saved))}catch(e){}};
const clean=w=>w.toLowerCase().replace(/[^a-z']/g,"");
const tts=window.speechSynthesis;
TEXTS.forEach(t=>$("#sel").add(new Option(t.title,t.id)));
$("#sel").onchange=e=>{cur=TEXTS.find(t=>t.id===e.target.value);ci=0;flip=false;stopAll();render()};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));["read","words","cards"].forEach(s=>$("#"+s).hidden=s!==b.dataset.t);if(b.dataset.t!=="read")stopAll();render()});
function render(){
 const box=$("#txt");box.innerHTML="";spans=[];offs=[];let pos=0;
 cur.body.split(" ").forEach((tok,i)=>{const s=document.createElement("span");s.className="w";s.textContent=tok;
  const k=clean(tok);if(saved[cur.id]&&saved[cur.id][k])s.classList.add("sv");
  s.onclick=()=>openPop(k,s);s.onmouseenter=()=>{if(matchMedia("(hover:hover)").matches)openPop(k,s)};
  box.append(s," ");spans.push(s);offs.push(pos);pos+=tok.length+1});
 const ws=saved[cur.id]||{};$("#cnt").textContent=Object.keys(ws).length||"";
 $("#words").innerHTML=Object.keys(ws).length?Object.entries(ws).map(([e,p])=>`<div class="item"><div><b>${e}</b><br><small>${p}</small></div><button class="x" data-w="${e}" aria-label="Remover">${ico("x")}</button></div>`).join(""):'<p class="mu">Nenhuma palavra salva neste texto ainda.</p>';
 $("#words").querySelectorAll(".x").forEach(b=>b.onclick=()=>{delete saved[cur.id][b.dataset.w];persist();render()});
 const keys=Object.keys(ws);
 if(!keys.length)$("#cards").innerHTML='<p class="mu">Salve palavras do texto para gerar flashcards.</p>';
 else{ci=Math.min(ci,keys.length-1);const e=keys[ci];
  $("#cards").innerHTML=`<div class="card${flip?" bk":""}" id="cd">${flip?e:ws[e]}<small>${flip?"English":"Português"} · toque para virar</small></div><p class="mu">${ci+1} / ${keys.length}</p><div class="row"><button class="btn" id="pv">← Anterior</button><button class="btn pri" id="nx">Próxima →</button></div>`;
  $("#cd").onclick=()=>{flip=!flip;render()};$("#pv").onclick=()=>{ci=(ci-1+keys.length)%keys.length;flip=false;render()};$("#nx").onclick=()=>{ci=(ci+1)%keys.length;flip=false;render()}}
}
function openPop(k,s){
 if(!k)return;$("#hint").style.display="none";if(tts&&tts.speaking&&!tts.paused){tts.pause();resume=true}
 const pt=cur.d[k];sel={k,pt};$("#pw").textContent=k;$("#pt").textContent=pt||"Tradução indisponível";
 const has=saved[cur.id]&&saved[cur.id][k];$("#save").innerHTML=has?ico("check")+"Salva":ico("bookmark")+"Salvar";$("#save").disabled=!pt||!!has;$("#pop").style.display="block"}
$("#save").onclick=()=>{(saved[cur.id]=saved[cur.id]||{})[sel.k]=sel.pt;persist();$("#save").innerHTML=ico("check")+"Salva";$("#save").disabled=true;spans.forEach(s=>{if(clean(s.textContent)===sel.k)s.classList.add("sv")})};
$("#cont").onclick=()=>{$("#pop").style.display="none";if(resume&&tts){tts.resume();resume=false}};
function stopAll(){if(tts)tts.cancel();playing=false;resume=false;$("#play").innerHTML=ico("play")+"Ouvir";spans.forEach(s=>s.classList.remove("cur"));$("#pop").style.display="none"}
$("#stop").onclick=stopAll;
$("#play").onclick=()=>{
 if(!tts){alert("Seu navegador não suporta leitura em voz alta.");return}
 if(playing&&!tts.paused){tts.pause();$("#play").innerHTML=ico("play")+"Continuar";return}
 if(playing&&tts.paused){tts.resume();$("#play").innerHTML=ico("pause")+"Pausar";return}
 const u=new SpeechSynthesisUtterance(cur.body);u.lang="en-US";u.rate=.85;
 u.onboundary=e=>{if(e.name&&e.name!=="word")return;let i=offs.findIndex((o,n)=>e.charIndex>=o&&(n===offs.length-1||e.charIndex<offs[n+1]));spans.forEach((s,n)=>s.classList.toggle("cur",n===i))};
 u.onend=()=>{playing=false;$("#play").innerHTML=ico("play")+"Ouvir";spans.forEach(s=>s.classList.remove("cur"))};
 playing=true;$("#play").innerHTML=ico("pause")+"Pausar";tts.speak(u)};
document.addEventListener("click",e=>{if($("#pop").style.display==="block"&&!e.target.closest("#pop,.w"))$("#cont").click()});
let user=null,last=null;
try{user=JSON.parse(localStorage.getItem("rl_user")||"null");last=localStorage.getItem("rl_last");const th=localStorage.getItem("rl_theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
const st=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function show(s){["login","home","study"].forEach(x=>$("#"+x).hidden=x!==s);$("nav").style.display=s==="study"?"flex":"none";$("#back").hidden=s!=="study";$("#logo").hidden=s==="study";$("#menuBtn").hidden=s==="login";$("#ttl").textContent=s==="study"?cur.title:"Read & Learn";if(s!=="study")stopAll();if(s==="home")home();window.scrollTo(0,0)}
function home(){$("#lst").hidden=true;$("#hi").textContent="Olá, "+(user&&user.name?user.name:"visitante")+"";const lt=TEXTS.find(t=>t.id===last);$("#resumeBtn").hidden=!lt;if(lt)$("#rs").textContent=lt.title;
 $("#list").innerHTML=TEXTS.map(t=>{const n=Object.keys(saved[t.id]||{}).length;return `<button class="txi" data-id="${t.id}"><b>${t.title}</b><small>${t.lv} · ${n} palavra${n===1?"":"s"} salva${n===1?"":"s"}</small></button>`}).join("");
 $("#list").querySelectorAll(".txi").forEach(b=>b.onclick=()=>openText(b.dataset.id))}
function openText(id){cur=TEXTS.find(t=>t.id===id);last=id;st("rl_last",id);ci=0;flip=false;stopAll();document.querySelectorAll("nav button").forEach((x,i)=>x.classList.toggle("on",i===0));["read","words","cards"].forEach(s=>$("#"+s).hidden=s!=="read");render();show("study")}
$("#start").onclick=()=>{$("#lst").hidden=false;$("#listH").scrollIntoView({behavior:"smooth"})};
$("#resumeBtn").onclick=()=>openText(last);$("#back").onclick=()=>show("home");
$("#enter").onclick=()=>{const n=$("#nm").value.trim();if(!n){$("#nm").focus();return}user={name:n};st("rl_user",JSON.stringify(user));show("home")};
$("#guest").onclick=()=>{user={name:""};st("rl_user",JSON.stringify(user));show("home")};
const dr=o=>{$("#drawer").classList.toggle("open",o);$("#scrim").hidden=!o};
$("#menuBtn").onclick=()=>{$("#dn").textContent=(user&&user.name)||"Visitante";dr(true)};$("#scrim").onclick=()=>dr(false);
document.querySelectorAll("#drawer [data-m]").forEach(b=>b.onclick=()=>{const m=b.dataset.m;dr(false);if(m==="home")show("home");
 if(m==="theme"){const d=document.documentElement;const dk=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dk?"light":"dark";st("rl_theme",d.dataset.theme)}
 if(m==="out"){user=null;st("rl_user","null");show("login")}});
render();show(user?"home":"login");
</script></body></html>
